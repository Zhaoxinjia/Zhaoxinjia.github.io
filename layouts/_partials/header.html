{{ $zh := eq .Lang "zh" }}
<a class="skip-link" href="#main-content">{{ if $zh }}跳至正文{{ else }}Skip to content{{ end }}</a>
<header class="header">
  <nav class="header-nav" aria-label="{{ if $zh }}主导航{{ else }}Main navigation{{ end }}">
    <a class="site-brand" href="{{ "" | relLangURL }}">
      <img src="{{ site.Params.label.icon | relURL }}" width="32" height="32" alt="">
      <span>{{ site.Title }}</span>
    </a>
    {{ $current := . }}
    <ul id="menu" class="menu">
      {{ range site.Menus.main }}
      {{ $url := .URL | relLangURL }}
      <li><a href="{{ $url }}"{{ if eq $current.RelPermalink $url }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
      {{ range .Translations }}
      <li class="language-switch"><a href="{{ .RelPermalink }}" lang="{{ .Lang }}" hreflang="{{ .Lang }}" aria-label="{{ if eq .Lang "zh" }}切换到中文对应页面{{ else }}View this page in English{{ end }}">{{ .Language.Label }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
