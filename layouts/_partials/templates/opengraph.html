<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ partial "page-title.html" . }}">
<meta property="og:description" content="{{ or .Description site.Params.description }}">
<meta property="og:locale" content="{{ if eq .Lang "zh" }}zh_CN{{ else }}en_US{{ end }}">
<meta property="og:image" content="{{ "img/og-cover.png" | absURL }}">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Xinjia Zhao — Nanopore sensing and single-molecule bioanalysis">
