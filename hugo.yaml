params:
  env: production
  title: "Xinjia Zhao"
  description: "Personal academic website of Xinjia Zhao — nanopore single-molecule sensing and bioanalysis."
  keywords: ["Xinjia Zhao", "nanopore", "single-molecule", "bioanalysis", "DICP", "CAS"]
  author: "Xinjia Zhao"

  defaultTheme: dark
  disableThemeToggle: false
  displayFullLangName: true

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: false
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: true
  hideSummary: false
  showtoc: false
  tocopen: false
  assets:
    disableHLJS: true
    favicon: "img/favicon.png"
    favicon16x16: "img/favicon.png"
    favicon32x32: "img/favicon.png"

  label:
    text: "Xinjia Zhao"
    icon: "img/avatar.png"
    iconHeight: 35

  homeInfoParams:
    Title: "Xinjia Zhao"
    Content: "Nanopore single-molecule sensing and bioanalysis."

  socialIcons:
    - name: email
      url: "mailto:zhaoxinjia@dicp.ac.cn"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=gJ9BsdAAAAAJ"
    - name: cv
      url: "cv/Xinjia_Zhao_CV.pdf"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    disabled: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
