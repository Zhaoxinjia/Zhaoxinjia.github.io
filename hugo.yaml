      main:
        - identifier: about
          name: About
          url: /about/
          weight: 1
        - identifier: research
          name: Research
          url: /research/
          weight: 2
        - identifier: publications
          name: Publications
          url: /publications/
          weight: 3
        - identifier: projects
          name: Projects
          url: /projects/
          weight: 4
        - identifier: contact
          name: Contact
          url: /contact/
          weight: 5
  zh:
    label: "中文"
    weight: 2
    title: "赵新佳"
    params:
      subtitle: "中国科学院大连化学物理研究所 助理研究员"
